<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveSpyer 播放器</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#ddd;font:14px "Microsoft YaHei",sans-serif}
video{width:100%;height:100%;object-fit:contain}
#audio-mode{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:radial-gradient(ellipse at 25% 20%,#b8ceff2e,transparent 60%),radial-gradient(ellipse at 80% 80%,#ffc5df20,transparent 55%),#111727;color:#e5ebff;pointer-events:none}
#audio-mode strong{font-size:28px;font-weight:500;letter-spacing:3px}
#audio-mode span{font-size:13px;color:#acb7d2}
body.audio-only video{visibility:hidden}
#message{position:absolute;top:18px;left:18px;max-width:calc(100% - 72px);pointer-events:none;background:rgba(26,32,52,.82);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%);border:1px solid #d8e4ff35;color:#eef2ff;padding:10px 16px;border-radius:14px;box-shadow:0 6px 24px #0002;animation:appear .2s ease-out}
#start{position:absolute;inset:0;margin:auto;width:190px;height:54px;border:1px solid #ffffff70;border-radius:18px;background:linear-gradient(115deg,#d3e2fff0,#f8d3e8ed);backdrop-filter:blur(20px);color:#3b4364;font:600 15px "Microsoft YaHei",sans-serif;cursor:pointer;box-shadow:0 8px 32px #0003;transition:transform .18s ease,box-shadow .18s ease}
#start:hover{transform:translateY(-2px);box-shadow:0 12px 32px #0004}
#start:active{transform:translateY(0)}
#start:focus-visible{outline:3px solid #aecbff;outline-offset:4px}
@keyframes appear{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#message{animation:none}#start{transition:none}}
#danmaku{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.danmaku-item{position:absolute;left:100%;white-space:nowrap;color:#fff;font-weight:600;font-size:20px;text-shadow:1px 1px 2px #000,-1px -1px 2px #000;will-change:transform}
.danmaku-item.gift-item{color:#ffd479}
[hidden]{display:none!important}
</style></head>
<body><video id="video" playsinline></video><div id="audio-mode" hidden><strong>正在听直播</strong><span>仅音频流 · 可随时恢复画面</span></div><div id="danmaku"></div><div id="message">等待直播流…</div><button id="start" hidden>点击开始播放</button>
<script src="hls.min.js"></script><script src="player.js"></script></body></html>
