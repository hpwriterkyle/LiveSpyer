<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveSpyer 播放器</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;color:#ddd;font:14px "Microsoft YaHei",sans-serif}
video{width:100%;height:100%;object-fit:contain}
#message{position:absolute;top:16px;left:16px;pointer-events:none;background:#0009;padding:6px 10px;border-radius:4px}
#start{position:absolute;inset:0;margin:auto;width:160px;height:48px;border:0;border-radius:6px;background:#eee;color:#111;font-size:16px;cursor:pointer}
[hidden]{display:none!important}
</style></head>
<body><video id="video" playsinline></video><div id="message">等待直播流…</div><button id="start" hidden>点击开始播放</button>
<script src="hls.min.js"></script><script src="player.js"></script></body></html>
